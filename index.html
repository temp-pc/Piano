<!DOCTYPE html>
<html lang="ja">

<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" lang="ja"
    charset="UTF-8">
  <title>Piano</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div id="headerContainer">
    <button id="midiButton" style="display: none;">MIDIを接続</button>
    <button id="addPianoButton">ピアノを追加</button>
    <div class="selector-container">
      <label for="numberOfKeysSelector" class="selector-label">鍵盤数:</label>
      <select name="numberOfKeysSelector" id="numberOfKeysSelector" class="custom-select"></select>
    </div>
    <div id="pitch-shift-wrapper" class="pitch-shift">
      <div>ピッチシフト</div>
      <button class="pitch-shift down">▼</button>
      <div id="pitch-shift-value"></div>
      <button class="pitch-shift up">▲</button>
    </div>
  </div>
  <div id="mainContainer">

  </div>
  <script src="script.js"></script>
</body>

</html>
