<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Piano</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <button class="header-toggle"></button>
  <div id="headerContainer">
    <div class="header-controls">
      <div class="header-group">
        <label for="numberOfKeysSelector">鍵盤数</label>
        <select id="numberOfKeysSelector" class="numberOfKeysSelector custom-select"></select>
      </div>
      <div class="header-group">
        <label for="volumeControl">音量</label>
        <input type="range" id="volumeControl" class="volume-control">
      </div>
      <div class="header-group">
        <label>ピッチシフト</label>
        <div id="pitchShiftWrapper">
          <div id="pitchShifter">
            <button class="pitchShift down">-</button>
            <span id="pitchShift-value">0</span>
            <button class="pitchShift up">+</button>
          </div>
        </div>
      </div>
      <button id="addPianoButton">ピアノを追加</button>
    </div>
  </div>
  <div id="mainContainer"></div>
  <script type="module" src="script.js"></script>
</body>

</html>
