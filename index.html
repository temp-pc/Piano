<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Piano</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div class="controls">
    <div class="control-group">
      <label for="numberOfKeysSelector">鍵盤数:</label>
      <select id="numberOfKeysSelector"></select>
    </div>
    <div class="control-group">
      <label for="volumeControl">音量:</label>
      <input type="range" id="volumeControl" min="0" max="1" step="0.01" value="0.3">
    </div>
    <div class="control-group">
      <label>ピッチシフト:</label>
      <button class="pitchShift down">↓</button>
      <span id="pitchShift-value">0</span>
      <button class="pitchShift up">↑</button>
    </div>
    <button id="addPianoButton">ピアノを追加</button>
  </div>
  <div id="mainContainer"></div>
  <script type="module" src="script.js"></script>
</body>

</html>
